# Build and smoke-test the archive_crate PyO3 extension (Phase 2.9).
name: rust
on:
  push:
    branches: [main, f/v2]
  pull_request:

jobs:
  archive_crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: archive_crate -> target
          rustflags: ""
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create Python virtualenv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install Python test dependencies
        run: python -m pip install -e ".[dev]" maturin
      - name: Build archive_crate
        working-directory: archive_crate
        run: maturin develop
      - name: Run Rust tests
        working-directory: archive_crate
        run: cargo test
      - name: Run archive_crate Python tests
        run: |
          python -m pytest archive_tests/test_archive_crate_smoke.py archive_tests/test_archive_crate_walk.py \
            archive_tests/test_archive_crate_hasher.py archive_tests/test_archive_crate_frontmatter.py \
            archive_tests/test_archive_crate_cache.py archive_tests/test_archive_crate_scanner.py \
            archive_tests/test_archive_crate_benchmark_tier1.py \
            archive_tests/test_archive_crate_materializer_chunker.py archive_tests/test_chunk_hash_parity.py \
            archive_tests/test_archive_crate_correctness.py \
            archive_tests/test_ppa_engine_vault_cache.py \
            archive_tests/test_serving_index.py -v
